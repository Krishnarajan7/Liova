name: Release

# Push a tag like v0.2.0 to build a universal DMG and open a *draft* GitHub Release.
# Nothing is published until a maintainer reviews the draft and clicks Publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (e.g. 0.2.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Release notes are in CHANGELOG.md
        # The version's section of CHANGELOG.md becomes the release notes.
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md"; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section. Move the [Unreleased] entries under it first."
            exit 1
          fi

      - name: Install tools
        run: brew install xcodegen swiftlint swiftformat

      - name: Run tests
        run: make test

      # The release certificate (scripts/release/create-release-cert.sh). Liova installs an
      # update by itself only when it's signed with the same certificate as the running
      # copy, and macOS keeps users' permissions across updates. Without the secrets the
      # build is signed ad-hoc: it works, but users update by hand.
      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.LIOVA_SIGNING_P12 }}
          PASSWORD: ${{ secrets.LIOVA_SIGNING_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            # A tagged release users install must carry the certificate: a copy signed ad-hoc
            # can never update itself to a signed one, so its users would update by hand forever.
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::LIOVA_SIGNING_P12 is not set. Run scripts/release/create-release-cert.sh and add the secrets (docs/DISTRIBUTION.md)."
              exit 1
            fi
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No signing certificate configured; signing ad-hoc (manual run, not for users)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/liova.keychain-db"
          security create-keychain -p liova "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p liova "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k liova "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Self-signed, so never "valid" (trusted) here; codesign signs with it all the same.
          # Picked by its SHA-1 so nothing else on the runner can match.
          IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | awk '/"Liova Release"/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::LIOVA_SIGNING_P12 has no \"Liova Release\" code-signing identity."
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: make release VERSION="$VERSION" SIGN_IDENTITY="${{ steps.signing.outputs.identity }}"

      - name: Write release notes
        run: |
          SHA=$(cut -d' ' -f1 "build/release/Liova-$VERSION.dmg.sha256")
          cat > build/release/notes.md <<NOTES
          ## Install

          1. Download **Liova-$VERSION.dmg** below and drag Liova into Applications.
          2. Open it. If macOS says it can't verify Liova, open **System Settings → Privacy & Security** and click **Open Anyway**. You only do this once.

          Works on Apple Silicon and Intel Macs running macOS 14 or later.

          SHA-256: \`$SHA\`

          ## What's new
          NOTES
          cat "$RUNNER_TEMP/changes.md" >> build/release/notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/release/Liova-$VERSION.dmg" "build/release/Liova-$VERSION.dmg.sha256" \
            --draft --title "Liova $VERSION" --notes-file build/release/notes.md
