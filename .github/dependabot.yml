# Keeps the GitHub Actions and the website's packages current. Liova's Swift package has no
# dependencies to update; the vendored mediaremote-adapter (Vendor/) is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "skip changelog"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      site:
        patterns: ["*"]
    labels: ["dependencies", "skip changelog"]
    commit-message:
      prefix: site
