name: Bug report
description: Something in Liova is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/Krishnarajan7/Liova/issues) first.
        **Security problems must not be filed here.** See [SECURITY.md](https://github.com/Krishnarajan7/Liova/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a song in Music
        2. Hover over the notch
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: liova-version
    attributes:
      label: Liova version
      description: Settings → About, or the commit hash if you built from source.
      placeholder: "0.1.0 or a1b2c3d"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: "macOS 26.1 (25B78)"
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      placeholder: "MacBook Pro 14-inch, M4, 2024"
    validations:
      required: true

  - type: dropdown
    id: notch
    attributes:
      label: Does the built-in display have a notch?
      options:
        - "Yes"
        - "No (virtual notch)"
        - "No built-in display (desktop Mac)"
    validations:
      required: true

  - type: textarea
    id: displays
    attributes:
      label: Displays
      description: List every connected display, its resolution, and which one is the main display. Mention if the lid is closed.
      placeholder: |
        - Built-in Liquid Retina XDR (main)
        - Dell U2723QE 4K over USB-C
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Liova?
      options:
        - DMG from GitHub Releases
        - Homebrew tap
        - Built from source
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: |
        Screenshots or a short screen recording help a lot for visual bugs.
        For logs, run `log show --last 10m --predicate 'subsystem BEGINSWITH "app.liova"'` in Terminal and paste the relevant part.
        Crash reports are in Console.app → Crash Reports. Remove anything personal before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest Liova release (or `main`).
          required: false
