name: Feature request
description: Suggest a new feature, live activity, or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Check the [roadmap](https://github.com/Krishnarajan7/Liova/blob/main/docs/ROADMAP.md) and [existing issues](https://github.com/Krishnarajan7/Liova/issues) first.
        Big or open-ended ideas are often better started in [Discussions](https://github.com/Krishnarajan7/Liova/discussions).

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: "When a long build finishes, I don't notice until I switch back to the terminal..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like Liova to do?
      description: How it should look and behave in the notch. Sketches or mockups welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other approaches, or how you work around it now.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core notch surface / motion
        - Media / Now Playing
        - Live activities
        - HUDs (volume, brightness)
        - File shelf
        - Calendar / productivity
        - Agent Island (coding agents)
        - Plugins / CLI / socket API
        - Settings / accessibility
        - Other
    validations:
      required: true

  - type: dropdown
    id: plugin
    attributes:
      label: Could this be a plugin instead of a built-in feature?
      description: Many features fit well as a tier 1 (CLI/socket) or tier 2 (declarative widget) plugin.
      options:
        - "Not sure"
        - "Yes, it could be a plugin"
        - "No, it needs to be built in"

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to work on a pull request for this.
