# XcodeGen spec. Run `make setup` (or `xcodegen`) to generate Liova.xcodeproj.
# The generated project is not committed; edit this file instead.
name: Liova

options:
  bundleIdPrefix: app.liova
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  LiovaKit:
    path: Packages/LiovaKit

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # No Apple Developer account yet: ad-hoc sign. Override with SIGN_IDENTITY in the Makefile.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    # Release is always universal: Apple Silicon and Intel in one app.
    Release:
      ARCHS: $(ARCHS_STANDARD)
      ONLY_ACTIVE_ARCH: NO

targets:
  Liova:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Liova.entitlements
      # Now Playing helper script (BSD-3, see Vendor/mediaremote-adapter/VENDORED.md).
      - path: Vendor/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
      # License notices ship inside the app (BSD-3 asks for it in binary distributions);
      # Settings > About > Licenses shows them. Copied from the originals at build time.
      - path: LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/Liova
      - path: Vendor/mediaremote-adapter/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/mediaremote-adapter
    dependencies:
      - package: LiovaKit
        product: LiovaCore
      - package: LiovaKit
        product: LiovaUI
      - package: LiovaKit
        product: LiovaFeatures
      - package: LiovaKit
        product: LiovaProviders
      - package: LiovaKit
        product: LiovaPluginKit
      - package: LiovaKit
        product: LiovaIPC
      # Built by `make vendor`. Loaded by /usr/bin/perl at runtime, never linked by Liova.
      - framework: build/vendor/mra/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.liova.Liova
        PRODUCT_NAME: Liova
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Liova
        CFBundleDisplayName: Liova
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: Liova shows your AirPods and other headphones when they connect, with their battery, and lets you switch noise control. It only reads connected audio devices.
        NSLocationUsageDescription: Liova shows the weather where you are. It asks for your approximate location only while Weather is on, and rounds it to about a kilometre before asking Open-Meteo.
        NSLocationWhenInUseUsageDescription: Liova shows the weather where you are. It asks for your approximate location only while Weather is on, and rounds it to about a kilometre before asking Open-Meteo.
        NSCalendarsFullAccessUsageDescription: Liova shows your next meeting in the notch and lists today's events. Events never leave your Mac.
        CFBundleURLTypes:
          - CFBundleURLName: app.liova.Liova
            CFBundleURLSchemes: [liova]
        NSHumanReadableCopyright: Copyright © 2026 Krishnarajan. MIT License.
    entitlements:
      path: App/Liova.entitlements
      properties:
        # Not sandboxed: a notch app needs window-server access the sandbox forbids.
        com.apple.security.app-sandbox: false
        # Hardened runtime blocks Location Services without this. Used only for Weather.
        com.apple.security.personal-information.location: true

schemes:
  Liova:
    build:
      targets:
        Liova: all
    run:
      config: Debug
    archive:
      config: Release
